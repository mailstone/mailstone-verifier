# Builds the four binaries on every version tag and attaches them to a
# GitHub release. macOS cannot be cross-compiled (Cocoa + cgo), so each
# target is built on its own runner; Windows is cross-compiled from Linux,
# which works as long as go-webview2 stays at the version Wails pins.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            output: mailstone-verifier-linux-amd64
          - os: ubuntu-22.04
            platform: windows/amd64
            output: mailstone-verifier-windows-amd64.exe
          - os: macos-13
            platform: darwin/amd64
            output: mailstone-verifier-darwin-amd64
          - os: macos-14
            platform: darwin/arm64
            output: mailstone-verifier-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install the Wails CLI at the module's version
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - name: Build
        run: wails build -platform ${{ matrix.platform }} -o ${{ matrix.output }}
      - name: Package the macOS bundle
        if: startsWith(matrix.platform, 'darwin')
        run: cd build/bin && ditto -c -k --keepParent "${{ matrix.output }}.app" "${{ matrix.output }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            build/bin/${{ matrix.output }}
            build/bin/${{ matrix.output }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
